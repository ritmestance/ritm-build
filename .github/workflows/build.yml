# Ritm's builds, run in a PUBLIC repository (free GitHub minutes) while the code stays in the
# PRIVATE one (ritmestance/ritm). Put this file at .github/workflows/build.yml of the public repo.
# Secrets of the public repo (Settings → Secrets and variables → Actions), never visible to anyone:
#   SOURCE_KEY        the private half of a read-only deploy key of ritmestance/ritm
#   ZIP_PASSWORD      the password of the built files (they're published encrypted with 7-Zip)
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Logs are public: no step prints the code. Built files are 7-Zip archives with hidden names,
# opened with ZIP_PASSWORD. See docs/BUILDER.md in the private repository.
name: Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit of ritmestance/ritm'
        default: main

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: app

jobs:
  tests:
    # every test (app, server and bot, Ritm Admin, website and deploy) on the code being built, with the real
    # libraries installed. The log is public: it shows only the pass/fail lines, never code.
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ritmestance/ritm
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install
        run: |
          npm install --no-audit --no-fund > /dev/null
          npx playwright install --with-deps chromium webkit firefox > /dev/null
          npm run sync > /dev/null
      - name: All tests
        working-directory: .
        run: |
          fail=0
          check() { # $1 = name, $2 = folder, then the command
            local name="$1" dir="$2"; shift 2
            (cd "$dir" && "$@") > "/tmp/$name.tap" 2>&1 || true
            echo "== $name: $(grep -E '^# pass' "/tmp/$name.tap" | tail -1) $(grep -E '^# fail' "/tmp/$name.tap" | tail -1)"
            grep -E '^not ok' "/tmp/$name.tap" | sed 's/^/   /' || true
            grep -qE '^# pass [1-9]' "/tmp/$name.tap" && ! grep -qE '^not ok' "/tmp/$name.tap" || fail=1
          }
          check app app node --test
          check server server npm test
          check admin admin npm test
          check deploy . node --test deploy/tests/*.test.mjs
          [ "$fail" = 0 ] || { echo "::error::Some tests failed (names above)"; exit 1; }

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ritmestance/ritm
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: android
      - name: Install build tool
        run: npm install --no-audit --no-fund
      - name: Prepare the Android project
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm run sync
          npx tauri android init --ci
          npx tauri icon assets/icon/ritm-logo-1024.png
          # 0.20.0: a proper adaptive launcher icon (the whole logo, not cropped by the launcher's shape)
          node scripts/android-icons.mjs
      - name: Build
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android build --apk --ci --target aarch64 armv7 x86_64
      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          # Phase 4: clear names: Ritm-<version>-android.apk (…-licence-required.apk for a release that asks for a licence)
          SUFFIX=""  # every build requires a licence (0.20.0): no marker needed
          UNSIGNED=$(find src-tauri/gen/android -name '*universal*release*unsigned*.apk' | head -1)
          [ -n "$UNSIGNED" ] || UNSIGNED=$(find src-tauri/gen/android -name '*.apk' -path '*release*' | head -1)
          echo "Built: $UNSIGNED"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p ../dist
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          if [ -z "$KEYSTORE_BASE64" ]; then
            # a release must be signed with Ritm's own key (or later updates won't install over it)
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing (docs/BUILDER.md, step 4)."; exit 1
            keytool -genkeypair -keystore debug.jks -storepass android -alias debug -keypass android -dname "CN=debug" -keyalg RSA -validity 10000 >/dev/null
            "$BT/apksigner" sign --ks debug.jks --ks-pass pass:android --out "../dist/Ritm-$VERSION-android$SUFFIX.apk" aligned.apk
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
            "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" --out "../dist/Ritm-$VERSION-android$SUFFIX.apk" aligned.apk
            rm release.jks
          fi
          "$BT/apksigner" verify --print-certs "../dist/Ritm-$VERSION-android$SUFFIX.apk" | head -3
          ls -la ../dist
      - name: Lock the files (7-Zip with the ZIP_PASSWORD secret; names hidden)
        working-directory: .
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
        run: |
          [ -n "$ZIP_PASSWORD" ] || { echo "::error::The ZIP_PASSWORD secret is missing"; exit 1; }
          # (a password pasted into GitHub often ends with a new line or a space: those aren't part of it)
          ZIP_PASSWORD=$(printf '%s' "$ZIP_PASSWORD" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          export LC_ALL=C
          echo "The password used has ${#ZIP_PASSWORD} characters."
          case "$ZIP_PASSWORD" in *[!\ -~]*) echo "::error::ZIP_PASSWORD has letters other than English letters, digits and symbols; 7-Zip on Windows can't match those. Use English letters and digits only."; exit 1;; esac
          VERSION=$(node -p "require('./app/package.json').version")
          :
          mkdir -p locked
          (cd dist && 7z a -t7z -mhe=on -p"$ZIP_PASSWORD" "../locked/Ritm-android-$VERSION.7z" . > /dev/null)
          ls -la locked
      - uses: actions/upload-artifact@v4
        with:
          name: ritm-android-apk-${{ github.run_number }}
          path: locked/*.7z
          retention-days: 7

  windows:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ritmestance/ritm
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install build tool
        run: npm install --no-audit --no-fund
      - name: App icons
        run: npm run sync && npx tauri icon assets/icon/ritm-logo-1024.png
      - name: Build
        run: npx tauri build
      - name: Collect files
        run: |
          mkdir -p ../dist
          # Phase 4: clear names: Ritm-<version>-setup.exe / -portable.exe (…-licence-required when chosen)
          VERSION=$(node -p "require('./package.json').version")
          SUFFIX=""  # every build requires a licence (0.20.0): no marker needed
          cp src-tauri/target/release/bundle/nsis/*.exe "../dist/Ritm-$VERSION-setup$SUFFIX.exe"
          cp src-tauri/target/release/ritm.exe "../dist/Ritm-$VERSION-portable$SUFFIX.exe"
          ls -la ../dist
      # 0.12.2: the student's data (WebView2's folder, %LOCALAPPDATA%\ir.ritmekonkur.ritm) must survive
      # installing a newer Ritm over an older one and uninstalling (unless the student ticks
      # the uninstaller's "delete the application data" box, which is off by default).
      - name: Installing over and uninstalling keep the student's data
        shell: pwsh
        run: |
          $setup = (Get-ChildItem ../dist/Ritm-*-setup*.exe | Select-Object -First 1).FullName
          Start-Process $setup -ArgumentList '/S' -Wait
          $data = Join-Path $env:LOCALAPPDATA 'ir.ritmekonkur.ritm\EBWebView'
          New-Item -ItemType Directory -Force $data | Out-Null
          $marker = Join-Path $data 'ritm-test-marker.txt'
          Set-Content $marker 'student data'
          Start-Process $setup -ArgumentList '/S' -Wait
          if (-not (Test-Path $marker)) { throw 'Installing over an existing Ritm deleted the student data' }
          $un = Join-Path $env:LOCALAPPDATA 'Ritm\uninstall.exe'
          if (-not (Test-Path $un)) {
            $key = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Get-ItemProperty | Where-Object { $_.DisplayName -like 'Ritm*' } | Select-Object -First 1
            if ($key) { $un = ($key.UninstallString -replace '"', '') }
          }
          if (-not (Test-Path $un)) { throw "Ritm's uninstaller was not found" }
          Start-Process $un -ArgumentList '/S', "_?=$(Split-Path $un)" -Wait
          if (-not (Test-Path $marker)) { throw 'Uninstalling Ritm deleted the student data' }
          Remove-Item -Recurse -Force (Split-Path $data)
          Write-Host 'The student data was kept after installing over and after uninstalling.'
      - name: Lock the files (7-Zip with the ZIP_PASSWORD secret; names hidden)
        working-directory: .
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
        run: |
          [ -n "$ZIP_PASSWORD" ] || { echo "::error::The ZIP_PASSWORD secret is missing"; exit 1; }
          # (a password pasted into GitHub often ends with a new line or a space: those aren't part of it)
          ZIP_PASSWORD=$(printf '%s' "$ZIP_PASSWORD" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          export LC_ALL=C
          echo "The password used has ${#ZIP_PASSWORD} characters."
          case "$ZIP_PASSWORD" in *[!\ -~]*) echo "::error::ZIP_PASSWORD has letters other than English letters, digits and symbols; 7-Zip on Windows can't match those. Use English letters and digits only."; exit 1;; esac
          VERSION=$(node -p "require('./app/package.json').version")
          :
          mkdir -p locked
          (cd dist && 7z a -t7z -mhe=on -p"$ZIP_PASSWORD" "../locked/Ritm-windows-$VERSION.7z" . > /dev/null)
          ls -la locked
      - uses: actions/upload-artifact@v4
        with:
          name: ritm-windows-${{ github.run_number }}
          path: locked/*.7z
          retention-days: 7

  admin:
    name: Ritm Admin (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ritmestance/ritm
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: admin/src-tauri
      - name: Shared code from the student app (design system, core rules, database engine)
        run: npm install --no-audit --no-fund && npm run sync
      - name: Install build tool
        working-directory: admin
        run: npm install --no-audit --no-fund
      - name: Icons
        working-directory: admin
        run: npx tauri icon ../app/assets/icon/ritm-logo-1024.png
      - name: Build
        working-directory: admin
        run: npx tauri build
      - name: Collect files
        working-directory: admin
        run: |
          mkdir -p ../dist
          AV=$(node -p "require('./package.json').version")
          cp src-tauri/target/release/bundle/nsis/*.exe "../dist/Ritm-Admin-$AV-setup.exe"
          cp src-tauri/target/release/ritm-admin.exe "../dist/Ritm-Admin-$AV-portable.exe"
          ls -la ../dist
      - name: Lock the files (7-Zip with the ZIP_PASSWORD secret; names hidden)
        working-directory: .
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
        run: |
          [ -n "$ZIP_PASSWORD" ] || { echo "::error::The ZIP_PASSWORD secret is missing"; exit 1; }
          # (a password pasted into GitHub often ends with a new line or a space: those aren't part of it)
          ZIP_PASSWORD=$(printf '%s' "$ZIP_PASSWORD" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          export LC_ALL=C
          echo "The password used has ${#ZIP_PASSWORD} characters."
          case "$ZIP_PASSWORD" in *[!\ -~]*) echo "::error::ZIP_PASSWORD has letters other than English letters, digits and symbols; 7-Zip on Windows can't match those. Use English letters and digits only."; exit 1;; esac
          VERSION=$(node -p "require('./app/package.json').version")
          :
          mkdir -p locked
          (cd dist && 7z a -t7z -mhe=on -p"$ZIP_PASSWORD" "../locked/Ritm-Admin-windows-$VERSION.7z" . > /dev/null)
          ls -la locked
      - uses: actions/upload-artifact@v4
        with:
          name: ritm-admin-windows-${{ github.run_number }}
          path: locked/*.7z
          retention-days: 7

  web:
    name: Web app (iPhone/iPad)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ritmestance/ritm
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Prepare
        run: |
          npm install --omit=dev --no-audit --no-fund
          npm run sync
          test -f web/vendor/sqlite/sqlite3.wasm || { echo "::error::Database engine missing from the web app"; exit 1; }
      - name: Lock the files (7-Zip with the ZIP_PASSWORD secret; names hidden)
        working-directory: .
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
        run: |
          [ -n "$ZIP_PASSWORD" ] || { echo "::error::The ZIP_PASSWORD secret is missing"; exit 1; }
          # (a password pasted into GitHub often ends with a new line or a space: those aren't part of it)
          ZIP_PASSWORD=$(printf '%s' "$ZIP_PASSWORD" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          export LC_ALL=C
          echo "The password used has ${#ZIP_PASSWORD} characters."
          case "$ZIP_PASSWORD" in *[!\ -~]*) echo "::error::ZIP_PASSWORD has letters other than English letters, digits and symbols; 7-Zip on Windows can't match those. Use English letters and digits only."; exit 1;; esac
          VERSION=$(node -p "require('./app/package.json').version")
          cp -r app/web dist-web
          mkdir -p locked
          (cd dist-web && 7z a -t7z -mhe=on -p"$ZIP_PASSWORD" "../locked/Ritm-web-$VERSION.7z" . > /dev/null)
          ls -la locked
      - uses: actions/upload-artifact@v4
        with:
          # the folder to put on the web server (inside the artifact; the name carries the build number)
          name: ritm-web-${{ github.run_number }}
          path: locked/*.7z
          retention-days: 7
